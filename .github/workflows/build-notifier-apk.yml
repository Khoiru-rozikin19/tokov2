name: Build Android APK (Toko Notifier)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'toko-notifier-app/**'
      - '.github/workflows/build-notifier-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Toko Notifier APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Environment
        run: |
          echo "==> Creating clean Flutter Android scaffold matching project..."
          flutter create --org com.tokovpn --project-name toko_notifier --platforms android official_template
          
          echo "==> Replacing android directory with official scaffolding..."
          rm -rf toko-notifier-app/android
          cp -r official_template/android toko-notifier-app/android
          
          echo "==> Injecting permissions & services into official AndroidManifest.xml..."
          python3 toko-notifier-app/inject_manifest.py toko-notifier-app/android/app/src/main/AndroidManifest.xml
          
          echo "==> Copying custom Kotlin services..."
          mkdir -p toko-notifier-app/android/app/src/main/kotlin/com/tokovpn/toko_notifier
          cp -f toko-notifier-app/custom_native/kotlin/*.kt toko-notifier-app/android/app/src/main/kotlin/com/tokovpn/toko_notifier/
          
          echo "==> Setting explicit compileSdk 34 and minSdk 23..."
          sed -i 's/compileSdk = .*/compileSdk = 34/g' toko-notifier-app/android/app/build.gradle
          sed -i 's/minSdk = .*/minSdk = 23/g' toko-notifier-app/android/app/build.gradle
          
          echo "==> Making gradlew executable..."
          chmod +x toko-notifier-app/android/gradlew

      - name: Get Dependencies
        working-directory: toko-notifier-app
        run: flutter pub get

      - name: Build APK Release
        working-directory: toko-notifier-app
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build_output.log

      - name: Debug On Failure
        if: failure()
        run: |
          echo "==== EXTRACTING GRADLE COMPILATION ERRORS ===="
          grep -i -C 5 "error" toko-notifier-app/build_output.log || true
          tail -n 150 toko-notifier-app/build_output.log > build_error_tail.txt
          curl -s -F "content=@build_error_tail.txt" https://dpaste.org/api/ > dpaste_link.txt || true
          
          git config --global user.email "ci@tokovpn.com"
          git config --global user.name "CI Bot"
          git checkout -B debug-log
          cp build_error_tail.txt build_error.txt
          git add build_error.txt
          git commit -m "debug: build error log [skip ci]" || true
          git push -f origin debug-log || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toko-notifier-release
          path: toko-notifier-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
