name: Build Android APK (Toko Notifier)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'toko-notifier-app/**'
      - '.github/workflows/build-notifier-apk.yml'

jobs:
  build:
    name: Build Toko Notifier APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Environment
        run: |
          echo "==> Creating clean Flutter Android scaffold..."
          flutter create --org com.tokovpn --project-name toko_notifier --platforms android official_template
          
          echo "==> Replacing android directory with official scaffolding..."
          rm -rf toko-notifier-app/android
          cp -r official_template/android toko-notifier-app/android
          
          echo "==> Injecting custom AndroidManifest.xml and Kotlin services..."
          cp -f toko-notifier-app/custom_native/AndroidManifest.xml toko-notifier-app/android/app/src/main/AndroidManifest.xml
          
          rm -rf toko-notifier-app/android/app/src/main/kotlin/*
          mkdir -p toko-notifier-app/android/app/src/main/kotlin/com/tokovpn/toko_notifier
          cp -f toko-notifier-app/custom_native/kotlin/*.kt toko-notifier-app/android/app/src/main/kotlin/com/tokovpn/toko_notifier/
          
          echo "==> Making gradlew executable..."
          chmod +x toko-notifier-app/android/gradlew

      - name: Get Dependencies
        working-directory: toko-notifier-app
        run: flutter pub get

      - name: Build APK Release
        working-directory: toko-notifier-app
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build_output.log

      - name: Report Build Error Details
        if: failure()
        run: |
          echo "### ⚠️ Detail Error Build APK" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 toko-notifier-app/build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toko-notifier-release
          path: toko-notifier-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
